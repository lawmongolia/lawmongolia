name: Daily LawMongolia Insights

on:
  schedule:
    # 09:00 Asia/Ulaanbaatar = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lawmongolia-insights
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate two bilingual legal insights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
          OPENAI_REVIEW_MODEL: gpt-5.6
          OPENAI_REASONING_EFFORT: high
        run: node scripts/generate-daily-insights.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit and push new articles
        shell: bash
        run: |
          if git diff --quiet -- content/insights; then
            echo "No new article files were generated."
            exit 0
          fi

          git config user.name "lawmongolia-insights-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/insights
          git commit -m "Publish daily legal insights"
          git push origin HEAD:main
